openapi: 3.0.3
info:
  title: AcmeX API
  description: Enterprise ACME v2 management API for automated TLS certificate lifecycle.
  version: 0.9.0
servers:
  - url: http://localhost:8080/api/v1
    description: Certificate lifecycle API v1
paths:
  /challenge-cleanup:
    get:
      summary: List challenge leases awaiting cleanup (including cleanup_failed)
      description: >
        Operator cleanup queue (T05): active, cleanup_pending and
        cleanup_failed leases as redacted views. cleanup_failed leases are
        the target of the manual retry entry.
      parameters:
        - name: pending
          in: query
          description: >
            Only the pending cleanup queue is exposed in v1; false is
            rejected with a problem response.
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: Cleanup-pending lease list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChallengeLeaseView'
        '400':
          $ref: '#/components/responses/Problem'
  /challenge-cleanup/{id}/retry:
    post:
      summary: Manually requeue a cleanup_failed lease
      description: >
        Transitions a cleanup_failed lease back to cleanup_pending without
        resetting cleanup_attempts (the failed-attempt audit trail is
        preserved). The background cleanup scanner retries the lease on its
        next pass.
      parameters:
        - $ref: '#/components/parameters/ChallengeLeaseId'
      responses:
        '200':
          description: Updated lease view in cleanup_pending state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengeLeaseView'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /certificate-intents:
    get:
      summary: List certificate intents
      responses:
        '200':
          description: Intent list
    post:
      summary: Create a certificate intent
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIntentRequest'
      responses:
        '201':
          description: Intent created or idempotently replayed
        '400':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /certificate-intents/{id}:
    get:
      summary: Get a certificate intent
      parameters:
        - $ref: '#/components/parameters/IntentId'
      responses:
        '200':
          description: Intent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntentView'
    patch:
      summary: Patch the mutable policy fields of a certificate intent
      description: >
        Synchronous partial update (T08): only renewal_policy and
        delivery_targets are mutable, and each provided field fully
        replaces the stored value; omitted fields keep their current
        values. identifiers, ca_policy, validation_policy, key_policy and
        idempotency_key are immutable for v1 — a certificate's SAN set
        cannot change in place (create a new intent instead) and patches
        naming them are rejected with 400. Optimistic concurrency: send
        If-Match with the previously observed generation; a stale
        generation is a 409. Without If-Match the patch applies
        last-write-wins. Every effective patch bumps the intent generation
        by one; a patch that changes no stored value is an idempotent
        no-op that returns the current view without bumping the
        generation.
      parameters:
        - $ref: '#/components/parameters/IntentId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatchGeneration'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchIntentRequest'
      responses:
        '200':
          description: Updated intent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntentView'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /certificate-intents/{id}/issue:
    post:
      summary: Create an issuance operation for an intent
      parameters:
        - $ref: '#/components/parameters/IntentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          $ref: '#/components/responses/OperationAccepted'
  /certificate-lineages/{id}:
    get:
      summary: Get a certificate lineage
      parameters:
        - $ref: '#/components/parameters/LineageId'
      responses:
        '200':
          description: Lineage
  /certificate-lineages/{id}/renew:
    post:
      summary: Create a renewal operation for a lineage
      parameters:
        - $ref: '#/components/parameters/LineageId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                force:
                  type: boolean
                  default: false
      responses:
        '202':
          $ref: '#/components/responses/OperationAccepted'
  /certificate-lineages/{id}/versions:
    get:
      summary: List immutable versions for a lineage
      parameters:
        - $ref: '#/components/parameters/LineageId'
      responses:
        '200':
          description: Version list
  /certificate-versions/{id}:
    get:
      summary: Get a certificate version without private key material
      parameters:
        - $ref: '#/components/parameters/VersionId'
      responses:
        '200':
          description: Version
  /certificate-versions/{id}/chain:
    get:
      summary: Get the PEM certificate chain for a version
      parameters:
        - $ref: '#/components/parameters/VersionId'
      responses:
        '200':
          description: Certificate chain only
  /certificate-versions/{id}/deploy:
    post:
      summary: Create a deployment operation for a version
      parameters:
        - $ref: '#/components/parameters/VersionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          $ref: '#/components/responses/OperationAccepted'
  /certificate-versions/{id}/revoke:
    post:
      summary: Create a revocation operation for a version
      parameters:
        - $ref: '#/components/parameters/VersionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          $ref: '#/components/responses/OperationAccepted'
  /operations:
    get:
      summary: List operations
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        '200':
          description: Operation list
  /operations/{id}:
    get:
      summary: Get operation status
      parameters:
        - $ref: '#/components/parameters/OperationId'
      responses:
        '200':
          description: Operation
  /operations/{id}/cancel:
    post:
      summary: Request operation cancellation
      parameters:
        - $ref: '#/components/parameters/OperationId'
      responses:
        '200':
          description: Updated operation
  /operations/{id}/challenges:
    get:
      summary: List token-safe challenge sessions for an operation
      description: >
        Challenge session lifecycle state (T05). Views never contain the
        token, its hash or a key authorization.
      parameters:
        - $ref: '#/components/parameters/OperationId'
      responses:
        '200':
          description: Challenge session list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChallengeSessionView'
        '404':
          $ref: '#/components/responses/Problem'
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
    IfMatchGeneration:
      name: If-Match
      in: header
      required: false
      description: >
        Expected intent generation for optimistic concurrency; a stale
        generation is rejected with 409. Accepts the bare generation (2)
        or the quoted ETag form ("2"). Omit for an unconditional
        last-write-wins patch.
      schema:
        type: integer
        format: uint64
        minimum: 1
    IntentId:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: '^int_'
    LineageId:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: '^lin_'
    VersionId:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: '^ver_'
    OperationId:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: '^op_'
    ChallengeLeaseId:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: '^chl_'
  responses:
    OperationAccepted:
      description: Durable operation accepted
      headers:
        Location:
          schema:
            type: string
          description: URL of the operation status resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OperationView'
    Problem:
      description: RFC 7807 problem response with AcmeX stable error code
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    CreateIntentRequest:
      type: object
      required:
        - identifiers
      properties:
        identifiers:
          type: array
          minItems: 1
          items:
            type: string
        ca_policy:
          type: object
        validation_policy:
          type: object
        key_policy:
          type: object
        renewal_policy:
          type: object
        delivery_targets:
          type: array
          items:
            type: object
    PatchIntentRequest:
      type: object
      description: >
        Mutable intent fields only (T08). At least one property is
        required. identifiers, ca_policy, validation_policy, key_policy
        and idempotency_key are immutable and rejected with a 400 naming
        them.
      minProperties: 1
      properties:
        renewal_policy:
          type: object
          description: Full replacement of the renewal policy.
        delivery_targets:
          type: array
          items:
            type: object
          description: Full replacement of the delivery target list.
    IntentView:
      type: object
      required:
        - id
        - tenant_id
        - identifiers
        - generation
      properties:
        id:
          type: string
        tenant_id:
          type: string
        identifiers:
          type: array
          items:
            type: string
        generation:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    VersionView:
      type: object
      required:
        - id
        - lineage_id
        - identifiers
        - serial
        - not_before
        - not_after
        - issued_by
        - state
        - key_provider
        - key_id
      properties:
        id:
          type: string
        lineage_id:
          type: string
        identifiers:
          type: array
          items:
            type: string
        serial:
          type: string
        not_before:
          type: string
        not_after:
          type: string
        issued_by:
          type: string
        state:
          type: string
        key_provider:
          type: string
        key_id:
          type: string
        verification_report:
          $ref: '#/components/schemas/CertificateVerificationReport'
      not:
        required:
          - private_key
    CertificateVerificationReport:
      type: object
      required:
        - schema_version
        - conclusion
        - identifiers_exact_match
        - not_before
        - not_after
        - serial
        - checks
      properties:
        schema_version:
          type: integer
          minimum: 1
        conclusion:
          type: string
          enum:
            - accepted
            - rejected
        error_code:
          type: string
        identifiers_exact_match:
          type: boolean
        not_before:
          type: string
          format: date-time
        not_after:
          type: string
          format: date-time
        serial:
          type: string
        ca:
          type: string
        profile:
          type: string
        checks:
          type: array
          items:
            $ref: '#/components/schemas/CertificateVerificationCheck'
    CertificateVerificationCheck:
      type: object
      required:
        - check
        - status
      properties:
        check:
          type: string
        status:
          type: string
          enum:
            - pass
            - fail
            - not-checked
        detail:
          type: string
        error_code:
          type: string
    OperationView:
      type: object
      required:
        - id
        - kind
        - status
        - progress
        - created_at
        - updated_at
        - cancel_allowed
        - subject
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [issue, renew, revoke, deploy, challenge_cleanup]
        status:
          type: string
          enum:
            - queued
            - running
            - waiting
            - succeeded
            - failed
            - cancel_requested
            - cancelled
            - compensating
            - compensation_failed
        current_step:
          type: string
        progress:
          type: number
          format: float
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        retry_at:
          type: string
          format: date-time
        cancel_allowed:
          type: boolean
        subject:
          type: object
        error_code:
          type: string
    Problem:
      type: object
      required:
        - type
        - title
        - status
        - detail
        - error_code
        - retryable
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        error_code:
          type: string
        retryable:
          type: boolean
        operation_id:
          type: string
    ChallengeSessionView:
      type: object
      description: >
        Token-safe challenge session projection (T05): no token, token hash
        or key authorization is ever serialized.
      required:
        - id
        - operation_id
        - authorization_url
        - identifier
        - challenge_type
        - state
        - deadline
      properties:
        id:
          type: string
        operation_id:
          type: string
        authorization_url:
          type: string
          format: uri
        identifier:
          type: string
          description: Canonical ACME wire value of the validated identifier.
        challenge_type:
          type: string
          enum: [dns-01, http-01, tls-alpn-01]
        state:
          type: string
          enum:
            - selected
            - preparing
            - prepared
            - observing
            - propagated
            - acknowledged
            - processing
            - valid
            - failed
            - cancelled
            - cleanup_pending
            - cleaned
            - cleanup_failed
        deadline:
          type: string
          format: date-time
        last_error:
          type: string
      not:
        required:
          - token
          - token_hash
    ChallengeLeaseView:
      type: object
      description: >
        Redacted challenge lease projection for the cleanup queue (T05):
        the locator is collapsed to a credential-free summary (DNS zone +
        record name, HTTP/TLS agent + route ids).
      required:
        - id
        - operation_id
        - challenge_type
        - locator_summary
        - cleanup_attempts
        - state
      properties:
        id:
          type: string
        operation_id:
          type: string
        challenge_type:
          type: string
          enum: [dns-01, http-01, tls-alpn-01]
        locator_summary:
          type: string
        cleanup_attempts:
          type: integer
          format: uint32
          minimum: 0
        last_cleanup_error:
          type: string
        state:
          type: string
          enum: [active, cleanup_pending, cleaned, cleanup_failed]
      not:
        required:
          - token
          - key_authorization
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
security:
  - ApiKeyAuth: []
