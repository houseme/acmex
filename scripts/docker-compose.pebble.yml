# Pebble E2E environment (roadmap T12/T13) — used by scripts/run_pebble_e2e.sh
#
#   docker compose -f scripts/docker-compose.pebble.yml up -d
#   cargo test --test live_pebble_e2e -- --ignored --nocapture
#
# pebble:     ACME test CA  — https://localhost:14000/dir (invalid TLS by design)
# challtestsrv: DNS/HTTP/TLS challenge test server — TXT records are
#             programmed over the admin API on :8055. DNS, HTTP-01 and
#             TLS-ALPN-01 are served from one stable Docker-network address so
#             Pebble's VA can reach the test server from inside the network.
#
# All host-side ports and the RFC 1918 subnet are overridable so several
# local stacks can coexist (envsubst-style `${VAR:-default}` substitution):
#   ACMEX_PEBBLE_DIR_PORT      host port for the ACME directory (default 14000)
#   ACMEX_PEBBLE_ADMIN_PORT    host port for Pebble's management API (default 15000)
#   ACMEX_PEBBLE_SUBNET        docker IPv4 subnet (default 10.30.50.0/24)
#   ACMEX_PEBBLE_IPV4          pebble's static IPv4 (default 10.30.50.2)
#   ACMEX_CHALLTESTSRV_IPV4    challtestsrv's static IPv4 (default 10.30.50.3)
#   ACMEX_PEBBLE_V6_SUBNET     docker IPv6 subnet (default fd3a:9d6d:1c4e::/64)
#   ACMEX_PEBBLE_IPV6          pebble's static IPv6 (default fd3a:9d6d:1c4e::2)
#   ACMEX_CHALLTESTSRV_IPV6    challtestsrv's static IPv6 (default fd3a:9d6d:1c4e::3)
#
# RFC 8738 note: for IP identifiers Pebble's VA dials the identifier IP:port
# directly (no DNS). challtestsrv serves HTTP-01 token-keyed, so HTTP-01 IP
# validation works against its static address. Its TLS-ALPN-01 endpoint only
# mints dNSName-SAN certificates, so IP TLS-ALPN-01 is served by acmex's own
# production `LocalTlsListener` (see tests/live_pebble_e2e.rs) instead.
name: acmex-pebble-e2e

# Host-side knobs (with defaults): host ports 14000/15000, challenge
# subnet 10.30.50.0/24. The IPv4 TLS-ALPN-01 IP scenario dials a host
# address that containers can reach — set PEBBLE_E2E_HOST_IPV4 when the
# OrbStack default (0.250.250.254) does not apply to your runtime.

services:
  pebble:
    # ghcr.io/letsencrypt/pebble mirrors the Docker Hub image; it is used
    # here because registry mirrors in some environments block docker.io.
    # The image's entrypoint IS the pebble binary, so the command carries
    # only flags (bool flags use `=` form — `-strict false` would leave
    # "false" as an invalid positional argument).
    image: ghcr.io/letsencrypt/pebble:latest
    command: ["-config", "/etc/pebble/pebble.json", "-dnsserver", "challtestsrv:8053", "-strict=false"]
    environment:
      # Deterministic, fast validation (no random sleeps/rejections).
      - PEBBLE_VA_NOSLEEP=1
      - PEBBLE_WFE_NONCEREJECT=0
      # New Pebble validates EVERY challenge offered in an authorization,
      # including draft types AcmeX cannot fulfil (dns-account-01,
      # dns-persist-01). Pin the test domain to always-valid so the
      # scenarios exercise our own challenge plumbing instead. DNS-01 is
      # additionally proven against the live VA without this override.
    volumes:
      - ./pebble/pebble.json:/etc/pebble/pebble.json:ro
    ports:
      - "${ACMEX_PEBBLE_DIR_PORT:-14000}:14000" # ACME directory (HTTPS)
      - "${ACMEX_PEBBLE_ADMIN_PORT:-15000}:15000" # admin API
    networks:
      pebble-net:
        ipv4_address: ${ACMEX_PEBBLE_IPV4:-10.30.50.2}
        ipv6_address: ${ACMEX_PEBBLE_IPV6:-fd3a:9d6d:1c4e::2}

  challtestsrv:
    image: ghcr.io/letsencrypt/pebble-challtestsrv:latest
    command:
      [
        "-management",
        ":8055",
        "-dnsserver",
        ":8053",
        "-http01",
        ":8052",
        "-tlsalpn01",
        ":8051",
        "-defaultIPv4",
        "${ACMEX_CHALLTESTSRV_IPV4:-10.30.50.3}",
        "-defaultIPv6",
        "${ACMEX_CHALLTESTSRV_IPV6:-fd3a:9d6d:1c4e::3}",
        "-https01",
        "",
        "-doh",
        "",
      ]
    ports:
      - "8055:8055" # admin HTTP API (set-txt / clear-txt / dump-dns)
      - "8053:8053/udp" # DNS for pebble's resolver
      - "8053:8053/tcp"
      # No host mappings for :8052/:8051: Pebble's VA dials challtestsrv's
      # in-network address directly, and the RFC 8738 TLS-ALPN-01 scenario
      # binds :8051 on the host for its own listener.
    networks:
      pebble-net:
        ipv4_address: ${ACMEX_CHALLTESTSRV_IPV4:-10.30.50.3}
        ipv6_address: ${ACMEX_CHALLTESTSRV_IPV6:-fd3a:9d6d:1c4e::3}

networks:
  pebble-net:
    driver: bridge
    enable_ipv6: true
    ipam:
      config:
        - subnet: ${ACMEX_PEBBLE_SUBNET:-10.30.50.0/24}
        - subnet: ${ACMEX_PEBBLE_V6_SUBNET:-fd3a:9d6d:1c4e::/64}
