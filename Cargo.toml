[package]
name = "acmex"
version = "0.8.0"
edition = "2024"
rust-version = "1.97.1"
description = "AcmeX: High-performance, extensible ACME v2 (RFC 8555) client and server in Rust, supporting multiple DNS providers, storage backends, and crypto libraries."
license = "MIT OR Apache-2.0"
authors = ["houseme <housemecn@gmail.com>"]
homepage = "https://houseme.github.io/acmex"
repository = "https://github.com/houseme/acmex"
documentation = "https://docs.rs/acmex"
keywords = ["acme", "tls", "certificate", "https", "letsencrypt"]
readme = "README.md"
categories = ["web-programming", "api-bindings", "asynchronous", "cryptography", "network-programming"]

[dependencies]
# Core Async & Runtime
tokio = { version = "1.53.1", features = ["full"] }
async-trait = "0.1.92"

# Web & API Server
axum = { version = "0.8.9", features = ["macros"] }
reqwest = { version = "0.13.4", features = ["json", "gzip", "query", "form", "blocking"] }
urlencoding = "2.1.3"

# Cryptography & Security
rcgen = { version = "0.14.10", features = ["crypto", "aws_lc_rs", "pem"], default-features = false }
x509-parser = { version = "0.18", features = ["verify-aws"] }
pem = "4.0.0"
base64 = "0.23.1"
hex = "0.4"
hmac = { version = "0.13.0" }
sha1 = "0.11.0"
sha2 = "0.11.0"
rustls = { version = "0.23.43", default-features = false, features = ["logging", "std", "tls12"] }
tokio-rustls = "0.26.4"

# Serialization & Configuration
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.4"

# Observability & Metrics
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
tracing-opentelemetry = "0.33.0"
opentelemetry = { version = "0.32.0", features = ["trace"] }
opentelemetry_sdk = { version = "0.32.1", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.32.0", features = ["grpc-tonic"] }
prometheus = "0.14"

# DNS & Networking
hickory-resolver = { version = "0.26.1", features = ["serde"] }
idna = "1.1.0"

# Utilities
clap = { version = "4.6", features = ["derive"] }
jiff = { version = "0.2.35", features = ["serde"] }
rand = "0.10.2"
regex = "1.13.1"

# Error Handling
thiserror = "2.0.20"

# --- Optional Dependencies & Feature-gated Backends ---

# Crypto Backends
aws-lc-rs = { version = "1.18.1", optional = true, features = ["fips"] }
ring = { version = "0.17.14", optional = true }

# AWS Route53 Support
aws-config = { version = "1.11.0", optional = true, default-features = false, features = [
  "behavior-version-latest",
  "credentials-process",
  "default-https-client",
  "rt-tokio",
  "sso",
] }
aws-sdk-route53 = { version = "1.121.0", optional = true, default-features = false, features = [
  "behavior-version-latest",
  "default-https-client",
  "rt-tokio",
] }

# Storage Backends
redis = { version = "1.6.0", features = ["tokio-comp", "connection-manager", "aio"], optional = true }

[features]
default = ["aws-lc-rs"]
aws-lc-rs = ["dep:aws-lc-rs"]
ring-crypto = ["dep:ring"]
redis = ["dep:redis"]
google-ca = []
zerossl-ca = []

dns-cloudflare = []
dns-route53 = ["dep:aws-config", "dep:aws-sdk-route53"]
dns-digitalocean = []
dns-linode = []
dns-azure = []
dns-google = []
dns-alibaba = []
dns-godaddy = []
dns-tencent = []
dns-huawei = []
dns-cloudns = []

metrics = []
cli = []

[dev-dependencies]
mockito = "1.7.2"
hex = "0.4.3"
tower = { version = "0.5.3", features = ["util"] }
